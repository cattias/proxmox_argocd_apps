# Custom Authentik blueprint, mounted into the server/worker pods at
# /blueprints/custom/argo-workflows.yaml (see authentik.yaml). Authentik's
# blueprint watcher picks up and (re)applies this file automatically, so the
# OAuth2 provider + Application for Argo Workflows are fully GitOps-managed.
#
# The client secret is injected at apply-time from the worker/server
# container's environment (see the `env` blocks added to authentik.yaml),
# which in turn comes from the argo-workflows-sso secret in
# proxmox_argocd_apps_secret — the same secret value is duplicated into the
# argo-workflows namespace for the Argo Workflows chart's server.sso config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-argo-workflows
  namespace: authentik
data:
  argo-workflows.yaml: |
    version: 1
    metadata:
      name: Argo Workflows OIDC
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: argo-workflows-provider
        identifiers:
          name: argo-workflows
        attrs:
          name: argo-workflows
          client_type: confidential
          client_id: f746bd69a895fa053617694fe905cc75af30eaaf
          client_secret: !Env [ARGO_WORKFLOWS_OIDC_CLIENT_SECRET, ""]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://argo-workflows.attias.io/oauth2/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: argo-workflows
        attrs:
          name: Argo Workflows
          slug: argo-workflows
          provider: !KeyOf argo-workflows-provider
          meta_launch_url: https://argo-workflows.attias.io
          policy_engine_mode: any
