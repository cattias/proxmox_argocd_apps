apiVersion: v1
kind: Service
metadata:
  name: kikiflix-service
  namespace: arr
spec:
  type: ExternalName
  externalName: 192.168.178.230
  ports:
    - protocol: TCP
      port: 32400
      targetPort: 32400
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kikiflix-router
  namespace: arr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kikiflix.attias.io`)
      kind: Rule
      services:
        - name: kikiflix-service
          port: 32400
      priority: 10
  tls:
    certResolver: le