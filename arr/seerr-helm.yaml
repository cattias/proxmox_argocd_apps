apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seerr
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Replace=true removed (2026-09-04) - this was the exact syncOption
      # that caused the ArgoCD self-management outage (kubectl replace is a
      # full PUT and trips Deployment/StatefulSet immutable-field checks
      # like spec.selector even when the value is unchanged). Plain
      # ServerSideApply patches only what actually changed, so it never
      # hits an unchanged immutable field. See argocd/argocd.yaml for the
      # original incident writeup.
  destination:
    namespace: arr
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: oci://ghcr.io/seerr-team/seerr/seerr-chart
    targetRevision: 3.9.1
    chart: seerr
    helm:
      valuesObject:
        image:
          registry: ghcr.io
          repository: seerr-team/seerr
          tag: v3.4.1
        config:
          persistence:
            existingClaim: seerr-config-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config-pvc
  namespace: arr
  labels:
    backupseerr: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-ceph
  resources:
    requests:
      storage: 5Gi