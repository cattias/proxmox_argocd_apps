apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: seerr-nfs-backup
  namespace: arr
spec:
  backup:
    schedule: "25 9 * * *"
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 2
    concurrentRunsAllowed: false
    promURL: http://prometheus-pushgateway.monitoring.svc.cluster.local:9091
    labelSelectors:
      - matchExpressions:
        - key: backupseerr
          operator: In
          values:
            - "true"
    volumes:
      - name: nas-repo
        persistentVolumeClaim:
          claimName: arr-backup-pvc
  prune:
    schedule: "0 4 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
    volumes:
      - name: nas-repo
        persistentVolumeClaim:
          claimName: arr-backup-pvc
  podConfigRef:
    name: nas-backup-pod-config
  backend:
    repoPasswordSecretRef:
      name: backup-repo-secret
      key: password
    local:
      mountPath: "/mnt/backup-repository"
    volumeMounts:
      - name: nas-repo
        mountPath: "/mnt/backup-repository"
        subPath: seerr_restic
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: nas-backup-pod-config
  namespace: arr
spec:
  template:
    spec:
      containers:
        - name: backup-arr
          securityContext:
            runAsUser: 1000
            # kiki's actual primary group on the NAS is 10 (admin), not
            # 1000 - gid 1000 doesn't map to any real account there. The
            # NAS's ACL engine (immich_restic's "permission denied" on
            # 2026-09-07) appears to need a (uid,gid) pair that resolves
            # to a real known account to grant kiki's explicit Admin
            # Read/Write ACL entry, not just a matching uid - see the
            # conversation history around this date for the full
            # diagnosis. runAsGroup: 1000 previously here was wrong.
            runAsGroup: 10
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: seerr-db-freeze
  namespace: arr
  labels:
    backupseerr: "true"
spec:
  backupCommand: |-
    sh -c "sqlite3 /data/db/db.sqlite3 .dump"
  pod:
    spec:
      # The seerr-config-pvc is ReadWriteOnce (Ceph RBD via proxmox-ceph).
      # Without this affinity the scheduler can place this pod on a
      # different node than the live seerr-seerr-chart-0 pod, and the
      # attach-detach controller then blocks forever waiting to detach
      # a volume that is still in active use - discovered 2026-09-07 when
      # a manually-triggered backup left this pod stuck in
      # ContainerCreating ("Volume is already used by pod(s)
      # seerr-seerr-chart-0"). Forcing co-location on the same node lets
      # the CSI driver mount the RWO volume to both pods there.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - seerr
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - seerr-chart
              topologyKey: kubernetes.io/hostname
      containers:
        - name: sqlite-dumper
          image: nouchka/sqlite3:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: seerr-config
              mountPath: /data
      volumes:
        - name: seerr-config
          persistentVolumeClaim:
            claimName: seerr-config-pvc