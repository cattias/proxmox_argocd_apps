# Self-healing for the 2026-09-07 incident: argocd-dex-server can end up
# "Running"/"Ready" while completely unable to serve logins, with nothing
# in Kubernetes noticing.
#
# Why a probe can't catch this (checked against dex's own source before
# writing this, not assumed): when ArgoCD's ContinueOnConnectorFailure mode
# is on and EVERY configured connector fails to open at boot (our case -
# just the one "authentik" connector), server.NewServer() returns an error
# and the caller never starts the main HTTP listener (port 5556) at all -
# matching the "connection refused" argocd-server saw. But the process
# itself doesn't exit, so kubelet's restart count never increments, and
# dex's own /healthz handler just calls a static HealthChecker.IsHealthy()
# that has nothing to do with connector state - so even the chart's
# built-in livenessProbe (dex.livenessProbe, httpPath: /healthz/live on the
# metrics port) would have stayed green throughout. There's also no
# built-in retry: a connector that fails to open at boot stays failed until
# the process restarts. Root cause of the boot-time failure itself was a
# one-off network blip (see argocd/argocd.yaml's migration-incident notes
# for the same day) - this doesn't fix that, it just makes sure a repeat
# doesn't sit broken for days again.
#
# So: poll the exact URL argocd-server itself queries, and if it's not
# answering, force a restart so dex gets a fresh attempt at opening its
# connectors (confirmed live on 2026-09-07 that a plain restart is enough
# once the underlying network issue has cleared). If it's STILL not
# healthy after a restart - i.e. something more than a transient blip,
# most likely Authentik itself being down - exit non-zero so the existing
# argo-workflows-failure-alert.yaml PrometheusRule (ArgoWorkflowFailed)
# fires. Self-heal quietly for the common case, only page a human when
# self-healing genuinely can't fix it.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: dex-selfheal
  namespace: argo-workflows
spec:
  schedules:
    - "*/5 * * * *"
  timezone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  # Short on purpose - this fires every 5 minutes, so a missed slot should
  # just get skipped rather than firing hours late.
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  workflowSpec:
    serviceAccountName: dex-selfheal
    entrypoint: main
    ttlStrategy:
      secondsAfterSuccess: 86400
      secondsAfterFailure: 86400
    templates:
      - name: main
        script:
          # Same image already tracked by Renovate for the other
          # kubectl-driven CronWorkflows in this folder - has both curl
          # and kubectl.
          image: alpine/k8s:1.36.4
          command: [sh]
          source: |
            set -eu

            # The exact URL argocd-server itself queries through dex - see
            # the "failed to query provider" error this reproduces.
            DEX_HEALTH_URL="https://argocd-dex-server.argocd.svc.cluster.local:5556/api/dex/.well-known/openid-configuration"

            check_healthy() {
              # -k: dex generates a fresh self-signed TLS cert every time
              # it (re)starts (see its own "Generating self-signed TLS
              # certificate for this session" log line) - there is no
              # stable CA to verify against, and argocd-server itself
              # talks to it the same way.
              curl -fsSk -m 5 -o /dev/null "$DEX_HEALTH_URL"
            }

            echo "Checking dex: $DEX_HEALTH_URL"
            if check_healthy; then
              echo "dex is healthy, nothing to do."
              exit 0
            fi

            echo "dex did not respond - restarting argocd-dex-server so it retries opening its connectors."
            kubectl rollout restart deployment/argocd-dex-server -n argocd
            kubectl rollout status deployment/argocd-dex-server -n argocd --timeout=120s

            # No flat sleep here on purpose - dex has no built-in readiness
            # probe, so the "kubectl rollout status" above only confirms the
            # new pod's container process started, not that dex itself
            # finished booting. Historical evidence (the original 2026-09-07 incident
            # log) shows dex can take ~30s just to sync its configmap/secret
            # informers before it even attempts to open a connector - so poll
            # with real retries instead of guessing a fixed wait.
            echo "Re-checking after restart (polling, dex can take ~30s+ to finish booting)..."
            RETRY=0
            MAX_RETRIES=18   # 18 * 5s = 90s grace period
            until check_healthy; do
              RETRY=$((RETRY + 1))
              if [ "$RETRY" -ge "$MAX_RETRIES" ]; then
                echo "dex is STILL not responding after a restart and a 90s grace period - this is more than just a slow boot (Authentik itself may be down). Exiting non-zero to trigger the ArgoWorkflowFailed alert."
                exit 1
              fi
              sleep 5
            done
            echo "dex is healthy again after the restart (took ~$((RETRY * 5))s to come back up)."
            exit 0
---
# Additive to the chart-managed argocd-dex-server-network-policy (Helm,
# 182 days old at time of writing) - NOT editing that one directly, since
# a manual edit to a Helm-owned object just gets fought/reverted on the
# next sync. Kubernetes NetworkPolicies for the same pod are unioned, so
# this coexists peacefully: the existing policy still only lets
# argocd-server reach ports 5556/5557, and this adds a second, separate
# allow for port 5556 from the argo-workflows namespace specifically -
# discovered 2026-09-07 when dex-selfheal's every single health check
# turned out to be silently blocked by that pre-existing policy (dex was
# actually healthy the whole time; the check just couldn't reach it).
#
# Scoped to the whole argo-workflows namespace rather than to a specific
# pod label - Argo Workflows' own podMetadata.labels field is documented
# as unreliable at actually landing on the pods it's supposed to label
# (see github.com/argoproj/argo-workflows/issues/7013), so a label-based
# NetworkPolicy selector here would risk silently and intermittently
# blocking dex-selfheal's own traffic again. Everything in argo-workflows
# is this repo's own automation already, so a namespace-wide allow is a
# reasonable trade-off for something this narrow (one port, one target
# Deployment).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dex-selfheal-network-policy
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-dex-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-workflows
      ports:
        - port: 5556
          protocol: TCP
