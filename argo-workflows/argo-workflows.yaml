apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Replace=true removed (2026-09-04) - this was the exact syncOption
      # that caused the ArgoCD self-management outage (kubectl replace is a
      # full PUT and trips Deployment/StatefulSet immutable-field checks
      # like spec.selector even when the value is unchanged). Plain
      # ServerSideApply patches only what actually changed, so it never
      # hits an unchanged immutable field. See argocd/argocd.yaml for the
      # original incident writeup.
  destination:
    namespace: argo-workflows
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: argo-workflows
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 2.0.15
    helm:
      releaseName: argo-workflows
      valuesObject:
        controller:
          # Without this the chart renders no ServiceMonitor at all, even with
          # serviceMonitor.enabled: true (it also requires metricsConfig or
          # telemetryConfig enabled) - so argo_workflows_count was never scraped
          # and the ArgoWorkflowFailed alert could never fire.
          metricsConfig:
            enabled: true
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: kube-prometheus-stack
          persistence: {}
        server:
          extraArgs:
            - --auth-mode=sso
          sso:
            enabled: true
            issuer: https://authentik.attias.io/application/o/argo-workflows/
            clientId:
              name: argo-workflows-sso
              key: client-id
            clientSecret:
              name: argo-workflows-sso
              key: client-secret
            redirectUrl: https://argo-workflows.attias.io/oauth2/callback
            scopes:
              - openid
              - profile
              - email
            rbac:
              enabled: false
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: kube-prometheus-stack
        workflow:
          serviceAccount:
            create: true
          rbac:
            create: true
