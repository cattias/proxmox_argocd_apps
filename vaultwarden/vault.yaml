apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Replace=true removed (2026-09-04) - this was the exact syncOption
      # that caused the ArgoCD self-management outage (kubectl replace is a
      # full PUT and trips Deployment/StatefulSet immutable-field checks
      # like spec.selector even when the value is unchanged). Plain
      # ServerSideApply patches only what actually changed, so it never
      # hits an unchanged immutable field. See argocd/argocd.yaml for the
      # original incident writeup.
  destination:
    namespace: vaultwarden
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://guerzon.github.io/vaultwarden
    targetRevision: 0.46.1
    chart: vaultwarden
    helm:
      valuesObject:
        image:
          repository: vaultwarden/server
          tag: 1.37.2
        domain: "https://vault.attias.io"
        database:
          type: postgresql
          existingSecret: "vaultwarden-db-app"
          existingSecretKey: "uri"
        adminToken:
          existingSecret: "vault-admin-token"
          existingSecretKey: "admin-token"
        signupsAllowed: false
        smtp:
          existingSecret: "vault-admin-token"
          host: "smtp-relay.brevo.com"
          port: 587
          from: "vault@attias.io"
          fromName: "Kiki Vault"
          username: 
            existingSecretKey: "smtp-username"
          password: 
            existingSecretKey: "smtp-password"
