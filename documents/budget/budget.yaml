apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: budget
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Replace=true removed (2026-09-04) - this was the exact syncOption
      # that caused the ArgoCD self-management outage (kubectl replace is a
      # full PUT and trips Deployment/StatefulSet immutable-field checks
      # like spec.selector even when the value is unchanged). Plain
      # ServerSideApply patches only what actually changed, so it never
      # hits an unchanged immutable field. See argocd/argocd.yaml for the
      # original incident writeup.
  destination:
    namespace: budget
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    targetRevision: 1.9.4
    chart: actualbudget
    helm:
      valuesObject:
        persistence:
          enabled: true
          existingClaim: budget-data-pvc
        extraEnvVars:
          ACTUAL_OPENID_ENFORCE: "true"