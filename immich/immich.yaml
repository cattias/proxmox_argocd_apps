apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  destination:
    namespace: photos
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: oci://ghcr.io/immich-app/immich-charts/immich
    targetRevision: 0.13.1
    chart: immich
    helm:
      valuesObject:
        controllers:
          main:
            containers:
              main:
                image:
                  repository: ghcr.io/immich-app/immich-server
                  tag: v3.1.0
                env:
                  REDIS_HOSTNAME: immich-redis
                  DB_URL:
                    valueFrom:
                      secretKeyRef:
                        name: immich-db-app
                        key: uri
        immich:
          metrics:
            enabled: false
          persistence:
            library:
              existingClaim: immich-library-pvc
          configuration:
            trash:
              enabled: true
              days: 30
            storageTemplate:
              enabled: true
              template: '{{ "{{" }}y{{ "}}" }}/{{ "{{" }}y{{ "}}" }}-{{ "{{" }}MM{{ "}}" }}-{{ "{{" }}dd{{ "}}" }}/{{ "{{" }}filename{{ "}}" }}'
        server:
          enabled: true
          service:
            main:
              type: LoadBalancer
        machine-learning:
          enabled: true
          persistence:
            cache:
              enabled: true
              size: 10Gi
              type: persistentVolumeClaim
              accessMode: ReadWriteOnce
              storageClass: proxmox-ceph