# Alerts when any Argo Workflow (i.e. any of the CronWorkflows in
# argo-workflows/*.yaml - k0s-autopilot-upgrade, ansible-daily-update,
# ansible-weekly-k0s-restart, soulsolid-rebuild) ends up sitting in Failed
# or Error phase.
#
# Uses the workflow controller's own built-in `argo_workflows_gauge` gauge
# (already scraped - controller.serviceMonitor.enabled: true is set in
# argo-workflows/argo-workflows.yaml) rather than anything workflow-authored,
# so a future CronWorkflow added to that folder is covered automatically
# with no change needed here.
#
# Known limitation: this metric's only label is `status` - no per-workflow
# or per-CronWorkflow name, so the alert can tell you *that* something
# failed but not *which* one. Check the Argo Workflows UI
# (https://argo-workflows.attias.io) for the actual failed run.
#
# NOTE: the metric is `argo_workflows_gauge{status=...}` on this chart
# version (argo-workflows 2.0.13). It was originally written against
# `argo_workflows_count`, which does not exist here, so the alert silently
# never fired. Also requires controller.metricsConfig.enabled: true in
# argo-workflows/argo-workflows.yaml - without it the chart renders no
# ServiceMonitor at all. If the controller ever serves TLS on its metrics
# port again (HTTP 400 on scrape), restart the controller pod.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argo-workflows-failure-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: argo-workflows.alerts
    interval: 1m
    rules:
    - alert: ArgoWorkflowFailed
      expr: argo_workflows_gauge{status=~"Failed|Error"} > 0
      for: 5m
      labels:
        severity: warning
        tier: automation
      annotations:
        summary: "An Argo Workflow ended in {{ $labels.status }}"
        description: >
          At least one workflow run in argo-workflows is sitting in
          {{ $labels.status }} state. Check
          https://argo-workflows.attias.io for which CronWorkflow it was
          (k0s-autopilot-upgrade, ansible-daily-update,
          ansible-weekly-k0s-restart, or soulsolid-rebuild) and why.
          It'll keep firing until the failed run is cleaned up (TTL is 1
          day) or re-run successfully.
