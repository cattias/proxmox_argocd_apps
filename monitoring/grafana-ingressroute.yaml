apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-router
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.attias.io`)
      kind: Rule
      middlewares:
        - name: internal-only
          namespace: traefik
      services:
        - name: grafana
          port: 80
  tls:
    certResolver: le
