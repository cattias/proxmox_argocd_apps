# One-shot, idempotent bucket creation on the existing Ceph RGW
# (http://192.168.178.69:7480, same gateway used by the barman-secret
# ObjectStores) so Loki has somewhere to write chunks/index.
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-s3-bucket-init
  namespace: monitoring
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: loki-s3-bucket-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: awscli
          image: amazon/aws-cli:latest
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: loki-s3-secret
                  key: ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: loki-s3-secret
                  key: ACCESS_SECRET_KEY
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              aws --endpoint-url http://192.168.178.69:7480 s3 mb s3://loki-logs || true
              aws --endpoint-url http://192.168.178.69:7480 s3 ls s3://loki-logs
