apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.55.0
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: s3
            bucketNames:
              chunks: loki-logs
              ruler: loki-logs
              admin: loki-logs
            s3:
              endpoint: 192.168.178.69:7480
              region: us-east-1
              s3ForcePathStyle: true
              insecure: true
              http_config:
                insecure_skip_verify: true
          schemaConfig:
            configs:
              - from: "2025-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            retention_period: 168h
            allow_structured_metadata: true
            volume_enabled: true
          compactor:
            retention_enabled: true
            delete_request_store: s3
          ingester:
            chunk_encoding: snappy
          querier:
            max_concurrent: 4
        # keep this small: single binary, no gateway/nginx in front, no
        # canary/self-monitoring stack — Alloy talks to the loki service directly
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            storageClass: proxmox-ceph
            size: 20Gi
          extraEnv:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: loki-s3-secret
                  key: ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: loki-s3-secret
                  key: ACCESS_SECRET_KEY
        gateway:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        test:
          enabled: false
        lokiCanary:
          enabled: false
        monitoring:
          serviceMonitor:
            enabled: true
            labels:
              release: kube-prometheus-stack
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
          lokiCanary:
            enabled: false
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
